name: Rule regression tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node beginner-card-impact-test.cjs
      - run: node beginner-card-usage-test.cjs
      - run: node blue-advanced-test.cjs
      - run: node green-guardian-test.cjs
      - run: node five-deck-test.cjs
      - run: node beginner-matchup-test.cjs
      - run: node beginner-round-test.cjs
      - run: node v044-test.cjs
      - run: node integrated-test.cjs
      - run: node vt-main-test.cjs
      - run: node over-rare-test.cjs
      - run: node lumiere-test.cjs
      - run: node shield-link-test.cjs
      - run: node next-batch-test.cjs
      - run: node legacy-red-removal-test.cjs
      - run: node card-name-test.cjs
      - run: node identity-test.cjs
      - run: node rename-test.cjs
      - run: node graveyard-test.cjs
      - run: node black-cards-test.cjs
      - run: node black-ssr-test.cjs
      - run: node draw-charger-test.cjs
      - run: node deck-exhaustion-test.cjs
      - run: node missions-test.cjs
      - run: node collection-test.cjs
      - run: node expansion-test.cjs
      - run: node just-diver-test.cjs
      - run: node update-test.cjs
      - run: node starter-test.cjs
      - run: node counterspell-test.cjs
      - run: node battle-log-test.cjs
      - run: node mana-test.cjs
      - run: node sideboard-test.cjs
      - run: node shield-test.cjs
      - run: node combat-test.cjs
      - run: node construction-test.cjs
      - run: for f in *.js *.cjs; do node --check "$f"; done
  pack-ui:
    strategy:
      fail-fast: false
      matrix:
        test: [motion-browser-test.cjs, v044-browser-test.cjs, integrated-browser-test.cjs, vt-main-browser-test.cjs, over-rare-browser-test.cjs, lumiere-browser-test.cjs, shield-link-browser-test.cjs, next-batch-browser-test.cjs, rename-browser-test.cjs, graveyard-browser-test.cjs, black-cards-browser-test.cjs, black-ssr-browser-test.cjs, normal-mode-browser-test.cjs, battle-ui-browser-test.cjs, draw-charger-browser-test.cjs, deck-exhaustion-browser-test.cjs, missions-browser-test.cjs, collection-browser-test.cjs, character-art-browser-test.cjs, pack-opening-browser-test.cjs]
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/cardgame-browser playwright @fontsource/noto-sans-jp
      - run: /tmp/cardgame-browser/node_modules/.bin/playwright install chromium
        timeout-minutes: 3
      - run: node "${{ matrix.test }}"
        env:
          NODE_PATH: /tmp/cardgame-browser/node_modules
      - uses: actions/upload-artifact@v4
        if: always() && matrix.test == 'over-rare-browser-test.cjs'
        with:
          name: over-rare-visual-check
          path: /tmp/or-*.png
          if-no-files-found: ignore
          retention-days: 7
