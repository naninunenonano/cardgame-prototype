name: Rule regression tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node deck-exhaustion-test.cjs
      - run: node missions-test.cjs
      - run: node collection-test.cjs
      - run: node expansion-test.cjs
      - run: node just-diver-test.cjs
      - run: node update-test.cjs
      - run: node starter-test.cjs
      - run: node battle-log-test.cjs
      - run: node mana-test.cjs
      - run: node sideboard-test.cjs
      - run: node shield-test.cjs
      - run: node combat-test.cjs
      - run: node construction-test.cjs
      - run: for f in *.js *.cjs; do node --check "$f"; done
  pack-ui:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/cardgame-browser playwright
      - run: /tmp/cardgame-browser/node_modules/.bin/playwright install chromium
        timeout-minutes: 3
      - run: node deck-exhaustion-browser-test.cjs
        env:
          NODE_PATH: /tmp/cardgame-browser/node_modules
      - run: node missions-browser-test.cjs
        env:
          NODE_PATH: /tmp/cardgame-browser/node_modules
      - run: node collection-browser-test.cjs
        env:
          NODE_PATH: /tmp/cardgame-browser/node_modules
      - run: node character-art-browser-test.cjs
        env:
          NODE_PATH: /tmp/cardgame-browser/node_modules
      - run: node pack-opening-browser-test.cjs
        env:
          NODE_PATH: /tmp/cardgame-browser/node_modules
