<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>盤面試作 Ver.0.11</title><link rel="stylesheet" href="style.css?v=0.11"></head><body>
<header><h1>盤面試作 <span>Ver.0.11</span></h1><div><button id="change-mode">デッキ選択へ</button><button id="reset">初期状態へ</button></div></header>
<section id="mode-select"><h2>デッキと遊び方を選択</h2><div class="deck-select"><label>自分のデッキ<select id="self-deck"><option value="green">緑</option><option value="blue">青</option></select></label><label>Bot／相手のデッキ<select id="opponent-deck"><option value="green">緑</option><option value="blue">青</option></select></label></div><button id="edit-decks">デッキ編集・保存</button><p>プリセット40枚／自作60枚＋土地20枚。初手5枚・手札上限なし。Bot戦の先攻はランダム。使用カードを約2秒表示します。</p><div class="actions"><button id="start-solo">壁打ち</button><button id="start-bot">Bot戦</button></div></section>
<section id="turn-panel" aria-label="ターンと操作"></section><p id="bot-status" role="status"></p><button id="retry-bot" hidden>Botを再開</button>
<fieldset id="normal-controls"><label>手動確認対象<select id="active"><option value="p1">プレイヤー1</option><option value="p2">プレイヤー2</option></select></label><label>手札公開<select id="visibility"><option value="active">対象のみ</option><option value="both">両者</option></select></label><label><input id="compact" type="checkbox">詳細補足</label><button id="add">仮カード追加（補助）</button></fieldset>
<p id="current-mode"></p><section id="setup"></section><main id="board"></main><section id="hands"></section><section id="control" aria-label="選択したカード"></section><p id="notice" role="status" aria-live="polite"></p>
<details id="event-log"><summary>公開履歴（<span id="log-count">0</span>件）</summary><div id="use-history"></div><ol id="log-list"></ol></details>
<details class="help"><summary>操作・試作設定</summary><p>カードをタップして使用・攻撃・拡大。山札やトラッシュは小さな枚数ボタンから一覧を開きます。土地は集約表示。選択中の効果は「選択を再開」で戻れます。初手5枚・手札上限なし・盾7枚、ユニット7枠。土地バウンス・土地用手札はありません。再読み込みで新規開始。</p></details>
<dialog id="deck-editor"><div class="modal-head"><h2>デッキ編集</h2><button id="editor-close">閉じる</button></div><div id="editor-body"></div></dialog>
<dialog id="modal"><div class="modal-head"><h2 id="modal-title"></h2><button id="close">保留して閉じる</button></div><div id="modal-body"></div></dialog>
<div id="card-announcement" hidden aria-live="polite"><section><p id="announcement-method"></p><div id="announcement-card"></div><p id="announcement-result"></p><small>約2秒表示。応答の制限時間ではありません。</small></section></div>
<div id="result-screen" hidden><section><h2 id="result-title"></h2><p id="result-reason"></p><div class="actions"><button id="inspect-result">盤面を確認</button><button id="replay">もう一度遊ぶ</button><button id="result-decks">デッキ選択へ</button></div></section></div>
<script src="mana.js?v=0.11"></script><script src="cards.js?v=0.11"></script><script src="decks.js?v=0.11"></script><script src="deck-editor.js?v=0.11"></script><script src="game.js?v=0.11"></script><script src="bot.js?v=0.11"></script><script src="bot-runner.js?v=0.11"></script><script src="app.js?v=0.11"></script></body></html>
